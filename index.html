<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>라벨 검수 뷰어</title>
<style>
:root{--bg:#15171b;--panel:#1d2026;--line:#2c3038;--text:#e3e6eb;--dim:#8b93a1;--acc:#4da3ff;
  --ok:#35c46a;--ng:#ff5a5a;--hold:#f2b03d;--warn:#ff9d3c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 system-ui,"Noto Sans KR",sans-serif;
  display:grid;grid-template-columns:300px 1fr 300px;grid-template-rows:auto 1fr auto;overflow:hidden}
header{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:7px 12px;background:var(--panel);
  border-bottom:1px solid var(--line)}
header b{font-size:14px}
#openform{display:flex;gap:6px;flex:0 1 460px;min-width:200px}
#openform button{white-space:nowrap}
#openform input{font-family:ui-monospace,monospace;font-size:12px}
#fname{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);user-select:all;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#progress{display:flex;align-items:center;gap:8px;white-space:nowrap}
#bar{width:180px;height:8px;border-radius:4px;background:var(--line);display:flex;overflow:hidden}
#bar i{display:block;height:100%}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);overflow-y:auto}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 7px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
select,input[type=text],textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:5px;padding:5px 7px;font:inherit}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.row:last-child{margin-bottom:0}
button{background:#2a2e37;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 9px;
  font:inherit;cursor:pointer}
button:hover{background:#343944}
button.on{border-color:var(--acc);background:#1d3552}
kbd{font:11px ui-monospace,monospace;background:#0e1013;border:1px solid var(--line);border-radius:3px;
  padding:0 4px;color:var(--dim)}
#list{flex:1;overflow-y:auto;min-height:0}
.it{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;border-left:3px solid transparent;
  font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap}
.it:hover{background:#252932}
.it.cur{background:#1d3552;border-left-color:var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;background:#444a55;flex:none}
.dot.ok{background:var(--ok)}.dot.ng{background:var(--ng)}.dot.hold{background:var(--hold)}
.it .n{color:var(--dim);margin-left:auto}
.it .w{color:var(--warn)}
#listinfo{padding:5px 12px;color:var(--dim);border-bottom:1px solid var(--line)}
main{position:relative;min-width:0;min-height:0;background:#0b0c0e}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#badge{position:absolute;left:12px;top:12px;padding:3px 12px;border-radius:5px;font-weight:700;font-size:15px;
  pointer-events:none;display:none}
#offline{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:70%;padding:8px 14px;border-radius:6px;
  background:#c62828;color:#fff;font-weight:600;text-align:center;display:none;box-shadow:0 2px 12px rgba(0,0,0,.5)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px}
.st{flex:1;padding:9px 0;font-weight:700}
.st.ok.on{background:var(--ok);border-color:var(--ok);color:#06220f}
.st.ng.on{background:var(--ng);border-color:var(--ng);color:#2b0505}
.st.hold.on{background:var(--hold);border-color:var(--hold);color:#2b1c00}
#tags{display:flex;flex-wrap:wrap;gap:5px}
#tags button.on{border-color:var(--ng);background:#4a1f1f}
#anns{max-height:260px;overflow-y:auto;font-family:ui-monospace,monospace;font-size:12px}
.an{display:flex;gap:8px;padding:2px 5px;cursor:pointer;border-radius:3px;align-items:center}
.an:hover{background:#252932}.an.sel{background:#1d3552}
.an.fl{color:var(--ng)}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.an .c{color:var(--warn);margin-left:auto}
label.ck{display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:3px}
#keys{color:var(--dim);line-height:1.9}
footer{grid-column:1/4;display:flex;gap:18px;padding:4px 12px;background:var(--panel);border-top:1px solid var(--line);
  color:var(--dim);font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap;overflow:hidden}
#saved{margin-left:auto}
#checks{color:var(--warn)}
.adv{display:none!important}
#finish{background:#1d4f2f;border-color:var(--ok);font-weight:700}
#finish:hover{background:#246b3c}
#memo.need{border-color:var(--ng);box-shadow:0 0 0 2px rgba(255,90,90,.35)}
</style>
</head>
<body>
<header>
  <b>라벨 검수</b>
  <form id="openform" title="데이터셋 폴더 경로 (zip을 푼 폴더도 됨)">
    <input type="text" id="dpath" placeholder="데이터셋 폴더 경로 입력 후 Enter" spellcheck="false">
    <button type="submit">열기</button>
  </form>
  <span id="pos"></span>
  <span id="fname"></span>
  <span id="progress"><span id="bar"></span><span id="ptxt"></span></span>
  <button id="export" class="adv" title="검수 결과를 CSV로 내보내기">CSV 내보내기</button>
  <button id="finish" title="검수 결과를 하나의 zip으로 묶어 저장">완료</button>
</header>

<aside id="left">
  <div class="sec">
    <div class="row"><input type="text" id="q" placeholder="파일명 검색"></div>
    <div class="row">
      <select id="fstatus" title="검수 상태">
        <option value="">상태: 전체</option><option value="none">미검수</option>
        <option value="ok">OK</option><option value="ng">NG</option><option value="hold">보류</option>
      </select>
      <select id="fcluster" class="adv" title="클러스터"></select>
    </div>
    <div class="row adv">
      <select id="fcheck" title="자동 검사"></select>
      <select id="fsort" title="정렬">
        <option value="">정렬: 기본</option><option value="cnt-d">라벨 많은 순</option>
        <option value="cnt-a">라벨 적은 순</option><option value="name">파일명 순</option>
      </select>
    </div>
  </div>
  <div id="listinfo"></div>
  <div id="list"></div>
</aside>

<main>
  <canvas id="cv"></canvas>
  <div id="badge"></div>
  <div id="offline"></div>
  <div id="loading">데이터 불러오는 중…</div>
</main>

<aside id="right">
  <div class="sec">
    <h3>판정</h3>
    <div class="row">
      <button class="st ok" data-s="ok">OK <kbd>1</kbd></button>
      <button class="st ng" data-s="ng">NG <kbd>2</kbd></button>
      <button class="st hold" data-s="hold">보류 <kbd>3</kbd></button>
    </div>
    <label class="ck"><input type="checkbox" id="autonext" checked> OK 판정 시 자동으로 다음 이미지</label>
  </div>
  <div class="sec adv">
    <h3>NG 사유</h3>
    <div id="tags"></div>
  </div>
  <div class="sec">
    <h3>메모</h3>
    <textarea id="memo" placeholder="NG면 무엇이 문제인지 적어 주세요. Enter = 다음 이미지 (줄바꿈은 Shift+Enter)"></textarea>
  </div>
  <div class="sec">
    <h3>표시</h3>
    <label class="ck"><input type="checkbox" id="vlabel" checked> 라벨 표시 <kbd>H</kbd> (누르는 동안 숨김 <kbd>Space</kbd>)</label>
    <label class="ck adv"><input type="checkbox" id="vfill" checked> 채우기 <kbd>G</kbd></label>
    <label class="ck"><input type="checkbox" id="vblink"> 채우기 깜빡임 <kbd>T</kbd></label>
    <label class="ck adv"><input type="checkbox" id="vbbox"> bbox <kbd>B</kbd></label>
    <label class="ck adv"><input type="checkbox" id="vnum"> 번호 <kbd>I</kbd></label>
    <label class="ck adv"><input type="checkbox" id="vpts"> 꼭짓점 <kbd>V</kbd></label>
    <div class="row">채우기 농도 <input type="range" id="alpha" min="0" max="80" value="25" style="flex:1"></div>
    <div class="row">깜빡임 속도 <input type="range" id="bspeed" min="1" max="12" value="4" style="flex:1"></div>
  </div>
  <div class="sec adv">
    <h3 id="annh">라벨</h3>
    <div id="anns"></div>
  </div>
  <div class="sec" id="keys">
    <h3>단축키</h3>
    <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 이전·다음 &nbsp; <kbd>N</kbd> 다음 미검수<br>
    <kbd>1</kbd> OK(자동 다음) &nbsp;<kbd>2</kbd> NG &nbsp;<kbd>3</kbd> 보류 &nbsp;<kbd>0</kbd> 판정 해제<br>
    NG를 누르면 메모 칸으로 이동 → 적고 <kbd>Enter</kbd> 하면 다음 이미지<br>
    <kbd>휠</kbd> 확대 &nbsp; <kbd>드래그</kbd> 이동 &nbsp; <kbd>R</kbd> 화면 맞춤<br>
    판정·메모는 자동 저장됩니다. 다 끝나면 오른쪽 위 <b>완료</b>
  </div>
</aside>

<footer>
  <span id="coord"></span><span id="hover"></span><span id="checks"></span><span id="saved"></span>
</footer>

<script>
const $ = s => document.querySelector(s);
const TAGS = ['누락', '불필요 라벨', '경계 부정확', '중복', '분할 오류', '기타'];
const CHECKS = {tiny: '작은 영역', overlap: '중복/겹침', few_pts: '점 3개 이하', bbox: 'bbox 불일치',
  oob: '이미지 밖', multi_part: '다중 폴리곤', no_ann: '라벨 없음', no_file: '이미지 없음'};
const ST = {ok: 'OK', ng: 'NG', hold: '보류'};
const SIMPLE_OFF = false;  // true로 바꾸면 Shift+클릭 누락 마커 사용
const ST_COLOR = {ok: '#35c46a', ng: '#ff5a5a', hold: '#f2b03d'};

let dataPath = null, images = [], review = {}, list = [], cur = -1, im = null;
let bitmap = null, loadToken = 0;
let view = {s: 1, x: 0, y: 0};
let sel = -1, hov = -1, peek = false;
let blinkOn = true, blinkTimer = null;  // 깜빡임: 채우기를 주기적으로 켰다 껐다 함
const cv = $('#cv'), ctx = cv.getContext('2d');
const rows = new Map();  // image index -> list row element

// ---------- 검수 기록 ----------
const blank = () => ({status: '', tags: [], memo: '', flagged: [], missing: []});
const rec = i => review[i.file] || blank();
function mutate(fn) {
  const r = review[im.file] || (review[im.file] = blank());
  fn(r);
  if ((r.flagged.length || r.missing.length || r.tags.length) && !r.status) r.status = 'ng';
  scheduleSave(im.file);
  refreshRow(im); renderSide(); renderProgress(); draw();
}
const pending = new Map(), failed = new Set();  // failed: 저장에 실패해 재시도 대기 중인 파일
let retryTimer = null;
function scheduleSave(file) {
  clearTimeout(pending.get(file));
  pending.set(file, setTimeout(() => save(file), 250));
  $('#saved').textContent = '저장 중…';
}
async function save(file) {
  pending.delete(file);
  let ok = false;
  try {
    const res = await fetch('/api/review', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({file, dataset: dataPath, rec: review[file] || blank()})});
    ok = res.ok;
  } catch (e) {}
  if (ok) failed.delete(file); else failed.add(file);
  showSaveState();
  return ok;
}
function showSaveState() {
  const n = failed.size;
  $('#offline').style.display = n ? 'block' : 'none';
  $('#saved').style.color = n ? 'var(--ng)' : '';
  if (n) {
    $('#offline').textContent = `⚠ 저장 안 된 검수 ${n}건 — 서버(viewer.py)에 연결할 수 없습니다. ` +
      '서버를 다시 실행하면 자동으로 저장되니, 그 전에 이 탭을 닫거나 새로고침하지 마세요.';
    $('#saved').textContent = `⚠ 저장 실패 ${n}건 (자동 재시도 중)`;
    if (!retryTimer) retryTimer = setTimeout(retryFailed, 3000);
  } else {
    $('#saved').textContent = '저장됨 ' + new Date().toLocaleTimeString();
  }
}
async function retryFailed() {
  retryTimer = null;
  for (const f of [...failed]) if (!await save(f)) break;  // 아직 안 되면 나머지는 다음 주기에
}

// ---------- 목록 / 필터 ----------
function shortName(i) {
  const m = i.file.replace(/\.\w+$/, '').split('__');
  return m.length >= 3 ? `${m[0].replace('cluster_', 'c')} ${m[1].replace(/^rgb_\d{4}/, '')} ${m[2].split('_')[0]}` : i.file;
}
function applyFilter(keepFile) {
  const q = $('#q').value.trim().toLowerCase(), fs = $('#fstatus').value, fc = $('#fcluster').value,
    fk = $('#fcheck').value, so = $('#fsort').value;
  list = images.filter(i => {
    const s = rec(i).status;
    if (q && !i.file.toLowerCase().includes(q)) return false;
    if (fs && (fs === 'none' ? s : s !== fs)) return false;
    if (fc && i.cluster !== fc) return false;
    if (fk === 'any' ? !i.checks.length : fk === 'flag' ? !(rec(i).flagged.length || rec(i).missing.length)
        : fk && !i.checks.includes(fk)) return false;
    return true;
  });
  if (so === 'cnt-d') list.sort((a, b) => b.anns.length - a.anns.length);
  if (so === 'cnt-a') list.sort((a, b) => a.anns.length - b.anns.length);
  if (so === 'name') list.sort((a, b) => a.file < b.file ? -1 : 1);
  const el = $('#list'); el.textContent = ''; rows.clear();
  const frag = document.createDocumentFragment();
  list.forEach((i, k) => {
    const d = document.createElement('div');
    d.className = 'it'; d.title = i.file; d.onclick = () => go(k);
    rows.set(i, d); fillRow(i, d); frag.appendChild(d);
  });
  el.appendChild(frag);
  $('#listinfo').textContent = `${list.length} / ${images.length}장`;
  const k = keepFile ? list.findIndex(i => i.file === keepFile) : -1;
  if (list.length) go(k >= 0 ? k : 0); else { cur = -1; im = null; bitmap = null; draw(); renderSide(); }
}
function fillRow(i, d) {
  const r = rec(i);
  const mark = (r.flagged.length || r.missing.length) ? ` <span style="color:var(--ng)">✎${r.flagged.length + r.missing.length}</span>` : '';
  d.innerHTML = `<span class="dot ${r.status}"></span><span>${shortName(i)}</span>${mark}` +
    `<span class="n">${i.checks.length ? '<span class="w">⚠</span> ' : ''}${i.anns.length}</span>`;
}
function refreshRow(i) { const d = rows.get(i); if (d) fillRow(i, d); }
function renderProgress() {
  const c = {ok: 0, ng: 0, hold: 0};
  for (const i of images) { const s = rec(i).status; if (s) c[s]++; }
  const done = c.ok + c.ng + c.hold, n = images.length || 1;
  $('#bar').innerHTML = ['ok', 'ng', 'hold'].map(s => `<i style="width:${c[s] / n * 100}%;background:${ST_COLOR[s]}"></i>`).join('');
  $('#ptxt').textContent = `${done}/${images.length} (${(done / n * 100).toFixed(1)}%) · OK ${c.ok} · NG ${c.ng} · 보류 ${c.hold}`;
}

// ---------- 이미지 이동 ----------
const cache = new Map();
function loadImg(file) {
  if (!cache.has(file)) {
    const p = new Promise((res, rej) => { const e = new Image(); e.onload = () => res(e); e.onerror = rej; e.src = '/img/' + encodeURIComponent(file); });
    cache.set(file, p);
    if (cache.size > 12) cache.delete(cache.keys().next().value);
  }
  return cache.get(file);
}
function go(k) {
  if (k < 0 || k >= list.length) return;
  if (cur >= 0 && rows.get(list[cur])) rows.get(list[cur]).classList.remove('cur');
  cur = k; im = list[k]; sel = hov = -1;
  const d = rows.get(im); d.classList.add('cur'); d.scrollIntoView({block: 'nearest'});
  $('#pos').textContent = `${k + 1} / ${list.length}`;
  $('#fname').textContent = im.file;
  try { localStorage.setItem('lv_last:' + dataPath, im.file); } catch (e) {}
  renderSide();
  const token = ++loadToken;
  bitmap = null; fit(); draw();
  loadImg(im.file).then(e => { if (token === loadToken) { bitmap = e; draw(); } })
    .catch(() => { cache.delete(im.file); if (token === loadToken) { bitmap = 'err'; draw(); } });
  for (const j of [k + 1, k + 2, k - 1]) if (list[j]) loadImg(list[j].file).catch(() => {});
}
function nextUnreviewed() {
  for (let j = 1; j <= list.length; j++) { const k = (cur + j) % list.length; if (!rec(list[k]).status) return go(k); }
}
function setStatus(s) {
  if (!im) return;
  if (rec(im).status !== s) mutate(r => { r.status = s; });
  if (s === 'ok' && $('#autonext').checked) go(cur + 1);
  else if (s === 'ng') $('#memo').focus();
}

// ---------- 우측 패널 ----------
function color(k, a) { return `hsla(${(k * 137.508) % 360},95%,58%,${a})`; }
function renderSide() {
  const r = im ? rec(im) : blank();
  document.querySelectorAll('.st').forEach(b => b.classList.toggle('on', b.dataset.s === r.status));
  document.querySelectorAll('#tags button').forEach(b => b.classList.toggle('on', r.tags.includes(b.textContent)));
  if (document.activeElement !== $('#memo')) $('#memo').value = r.memo;
  $('#memo').classList.toggle('need', r.status === 'ng' && !r.memo.trim());
  const b = $('#badge');
  b.style.display = r.status ? 'block' : 'none'; b.textContent = ST[r.status] || '';
  b.style.background = ST_COLOR[r.status] || ''; b.style.color = '#111';
  $('#checks').textContent = im && im.checks.length ? '⚠ 자동검사: ' + im.checks.map(c => CHECKS[c] || c).join(', ') : '';
  const box = $('#anns'); box.textContent = '';
  if (!im) { $('#annh').textContent = '라벨'; return; }
  $('#annh').textContent = `라벨 ${im.anns.length}개` + (r.flagged.length ? ` · 불량 ${r.flagged.length}` : '') + (r.missing.length ? ` · 누락 마커 ${r.missing.length}` : '');
  im.anns.forEach((a, k) => {
    const d = document.createElement('div');
    d.className = 'an' + (k === sel ? ' sel' : '') + (r.flagged.includes(a.id) ? ' fl' : '');
    d.innerHTML = `<span class="sw" style="background:${color(k, 1)}"></span><span>#${k + 1}</span>` +
      `<span style="color:var(--dim)">${Math.round(a.area)}px² · ${a.seg.length / 2}pt</span>` +
      `<span class="c">${r.flagged.includes(a.id) ? '불량 ' : ''}${a.checks.map(c => CHECKS[c] || c).join(',')}</span>`;
    d.onclick = () => { sel = k; renderSide(); draw(); };
    d.ondblclick = () => zoomTo(k);
    box.appendChild(d);
    if (k === sel) d.scrollIntoView({block: 'nearest'});
  });
}

// ---------- 캔버스 ----------
function resize() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
}
function fit() {
  if (!im) return;
  const r = cv.getBoundingClientRect(), pad = 8;
  view.s = Math.min((r.width - pad * 2) / im.w, (r.height - pad * 2) / im.h);
  view.x = (r.width - im.w * view.s) / 2; view.y = (r.height - im.h * view.s) / 2;
}
function zoomTo(k) {
  if (!im || k < 0) return;
  const [x, y, w, h] = im.anns[k].bbox, r = cv.getBoundingClientRect();
  view.s = Math.min(12, Math.min(r.width / (w * 3), r.height / (h * 3)));
  view.x = r.width / 2 - (x + w / 2) * view.s; view.y = r.height / 2 - (y + h / 2) * view.s;
  draw();
}
function path(seg) {
  ctx.beginPath(); ctx.moveTo(seg[0], seg[1]);
  for (let i = 2; i < seg.length; i += 2) ctx.lineTo(seg[i], seg[i + 1]);
  ctx.closePath();
}
function centroid(seg) {
  let x = 0, y = 0; const n = seg.length / 2;
  for (let i = 0; i < seg.length; i += 2) { x += seg[i]; y += seg[i + 1]; }
  return [x / n, y / n];
}

function draw() {
  const dpr = devicePixelRatio || 1;

  if (!im) return;
  ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.x, dpr * view.y);
  const px = 1 / view.s;
  if (bitmap && bitmap !== 'err') {

    ctx.drawImage(bitmap, 0, 0, im.w, im.h);
  } else {
    ctx.fillStyle = '#1a1c20'; ctx.fillRect(0, 0, im.w, im.h);
    ctx.fillStyle = '#8b93a1'; ctx.font = `${16 * px}px system-ui`; ctx.textAlign = 'center';
    ctx.fillText(bitmap === 'err' ? '이미지를 불러올 수 없습니다' : '불러오는 중…', im.w / 2, im.h / 2);
  }
  const r = rec(im);
  if ($('#vlabel').checked && !peek) {
    const alpha = $('#alpha').value / 100, fill = $('#vblink').checked ? blinkOn : $('#vfill').checked;
    im.anns.forEach((a, k) => {
      if (a.seg.length < 6) return;
      const fl = r.flagged.includes(a.id), hi = k === sel || k === hov;
      path(a.seg);
      if (fill || hi) { ctx.fillStyle = fl ? `rgba(255,60,60,${Math.max(alpha, .3)})` : color(k, hi ? Math.max(alpha, .15) + .15 : alpha); ctx.fill(); }
      ctx.lineJoin = 'round';
      ctx.setLineDash(fl ? [6 * px, 4 * px] : []);
      ctx.lineWidth = (k === sel ? 3 : fl ? 2.5 : 1.6) * px;
      ctx.strokeStyle = k === sel ? '#fff' : fl ? '#ff3c3c' : color(k, 1);
      ctx.stroke(); ctx.setLineDash([]);
      if ($('#vbbox').checked) {
        ctx.lineWidth = px; ctx.strokeStyle = color(k, .9); ctx.setLineDash([4 * px, 3 * px]);
        ctx.strokeRect(a.bbox[0], a.bbox[1], a.bbox[2], a.bbox[3]); ctx.setLineDash([]);
      }
      if ($('#vpts').checked || k === sel) {
        ctx.fillStyle = k === sel ? '#fff' : color(k, 1);
        const s = (k === sel ? 2.5 : 1.8) * px;
        for (let i = 0; i < a.seg.length; i += 2) ctx.fillRect(a.seg[i] - s, a.seg[i + 1] - s, s * 2, s * 2);
      }
    });
    im.anns.forEach((a, k) => {
      if (a.seg.length < 6) return;
      const fl = r.flagged.includes(a.id), [cx, cy] = centroid(a.seg);
      if (fl) tag('불량 #' + (k + 1), cx, cy, '#ff3c3c', '#fff');
      else if ($('#vnum').checked) tag(String(k + 1), cx, cy, 'rgba(0,0,0,.7)', color(k, 1));
      else if (a.checks.length) tag('!', cx, cy, '#ff9d3c', '#111');

    ctx.beginPath(); ctx.moveTo(x - 7 * px, y); ctx.lineTo(x + 7 * px, y); ctx.moveTo(x, y - 7 * px); ctx.lineTo(x, y + 7 * px); ctx.stroke();

function toImg(e) {
  const r = cv.getBoundingClientRect();

}

let drag = null;
cv.addEventListener('mousedown', e => { drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false}; });
window.addEventListener('mousemove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; draw(); }
    return;
  }
  if (e.target !== cv || !im) return;
  const [x, y] = toImg(e), h = hit(x, y);
  $('#coord').textContent = `x ${Math.round(x)}  y ${Math.round(y)}  ×${view.s.toFixed(2)}`;
  if (h !== hov) {
    hov = h; draw();
    const a = im.anns[h];
    $('#hover').textContent = a ? `#${h + 1}  id ${a.id}  ${Math.round(a.area)}px²  ${a.seg.length / 2}pt  bbox ${a.bbox.map(Math.round).join(',')}` : '';
  }
});
window.addEventListener('mouseup', e => {
  const d = drag; drag = null;
  if (!d || d.moved || e.target !== cv || !im) return;
  const [x, y] = toImg(e);
  if (e.shiftKey && SIMPLE_OFF) {
    mutate(r => {
      const k = r.missing.findIndex(p => Math.hypot(p[0] - x, p[1] - y) < 16 / view.s);
      if (k >= 0) r.missing.splice(k, 1);
      else if (x >= 0 && y >= 0 && x <= im.w && y <= im.h) r.missing.push([Math.round(x), Math.round(y)]);
    });
    return;
  }
  sel = hit(x, y); renderSide(); draw();
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const s = Math.min(40, Math.max(.05, view.s * Math.exp(-e.deltaY * .0015)));
  view.x = mx - (mx - view.x) * s / view.s; view.y = my - (my - view.y) * s / view.s; view.s = s;
  draw();

cv.addEventListener('dblclick', e => { if (!e.shiftKey) { const [x, y] = toImg(e), h = hit(x, y); if (h >= 0) zoomTo(h); else { fit(); draw(); } } });
new ResizeObserver(() => { resize(); fit(); draw(); }).observe(cv);

// ---------- 입력 ----------
function toggleFlag() {
  if (!im || sel < 0) return;
  const id = im.anns[sel].id;
  mutate(r => { const k = r.flagged.indexOf(id); if (k >= 0) r.flagged.splice(k, 1); else r.flagged.push(id); });
}
const flip = id => { const c = $(id); c.checked = !c.checked; draw(); };
function setBlink() {
  clearInterval(blinkTimer); blinkTimer = null; blinkOn = true;
  const on = $('#vblink').checked, sp = +$('#bspeed').value;
  if (on) blinkTimer = setInterval(() => { blinkOn = !blinkOn; draw(); }, 2000 / sp);
  try { localStorage.setItem('lv_blink', JSON.stringify({on, sp})); } catch (e) {}
  draw();
}
window.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (t === 'TEXTAREA' || (t === 'INPUT' && e.target.type === 'text')) {
    if (e.key === 'Escape') e.target.blur();
    if (e.target.id === 'memo' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.target.blur(); go(cur + 1); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const map = {
    ArrowRight: () => go(cur + 1), d: () => go(cur + 1), ArrowLeft: () => go(cur - 1), a: () => go(cur - 1),
    n: nextUnreviewed, '1': () => setStatus('ok'), '2': () => setStatus('ng'), '3': () => setStatus('hold'),
    '0': () => im && rec(im).status && mutate(r => { r.status = ''; }),
    h: () => flip('#vlabel'), g: () => flip('#vfill'), b: () => flip('#vbbox'),
    t: () => { const c = $('#vblink'); c.checked = !c.checked; setBlink(); },
    i: () => flip('#vnum'), v: () => flip('#vpts'), r: () => { fit(); draw(); }, z: () => zoomTo(sel),
    Escape: () => { sel = -1; renderSide(); draw(); },
    ' ': () => { if (!peek) { peek = true; draw(); } },
    Home: () => go(0), End: () => go(list.length - 1),
  };
  if (map[k]) { e.preventDefault(); if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); map[k](); }

window.addEventListener('keyup', e => { if (e.key === ' ') { peek = false; draw(); } });
window.addEventListener('blur', () => { peek = false; drag = null; draw(); });
document.querySelectorAll('.st').forEach(b => b.onclick = () => setStatus(b.dataset.s));
for (const t of TAGS) {
  const b = document.createElement('button'); b.textContent = t;
  b.onclick = () => im && mutate(r => { const k = r.tags.indexOf(t); if (k >= 0) r.tags.splice(k, 1); else r.tags.push(t); });
  $('#tags').appendChild(b);
}
$('#memo').addEventListener('input', e => {
  if (!im) return;
  (review[im.file] || (review[im.file] = blank())).memo = e.target.value;
  $('#memo').classList.toggle('need', rec(im).status === 'ng' && !e.target.value.trim());
  scheduleSave(im.file);
});
for (const id of ['#vlabel', '#vfill', '#vbbox', '#vnum', '#vpts', '#alpha']) $(id).addEventListener('input', draw);
for (const id of ['#vblink', '#bspeed']) $(id).addEventListener('input', setBlink);
for (const id of ['#fstatus', '#fcluster', '#fcheck', '#fsort']) $(id).addEventListener('change', () => applyFilter(im && im.file));
let qt; $('#q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => applyFilter(im && im.file), 200); });
$('#export').onclick = async () => {
  await Promise.all([...pending.keys()].map(f => { clearTimeout(pending.get(f)); return save(f); }));
  if (failed.size && !confirm(`저장 안 된 검수 ${failed.size}건은 CSV에 들어가지 않습니다. 그래도 내보낼까요?`)) return;
  location.href = '/api/export.csv';
};
$('#finish').onclick = async () => {
  if (!dataPath) return;
  await Promise.all([...pending.keys()].map(f => { clearTimeout(pending.get(f)); return save(f); }));
  if (failed.size) return alert(`저장 안 된 검수 ${failed.size}건이 있습니다. 서버를 다시 켠 뒤 눌러 주세요.`);
  const left = images.filter(i => !rec(i).status).length;
  const noMemo = images.filter(i => rec(i).status === 'ng' && !rec(i).memo.trim()).length;
  const warn = [left && `미검수 ${left}장`, noMemo && `메모 없는 NG ${noMemo}장`].filter(Boolean).join(', ');
  if (!confirm((warn ? `⚠ ${warn}이 남아 있습니다.\n` : '') + '검수 결과를 zip으로 묶어 저장할까요?')) return;
  try {
    const res = await fetch('/api/finish', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || res.status);
    alert(`완료! 아래 파일을 구글 드라이브에 올려 주세요.\n\n${j.path}\n\n(OK ${j.ok} · NG ${j.ng} · 보류 ${j.hold} · 미검수 ${j.none})`);
    location.href = '/api/finish/download?name=' + encodeURIComponent(j.name);
  } catch (e) { alert('저장하지 못했습니다: ' + e.message); }
};
window.addEventListener('beforeunload', e => { if (pending.size || failed.size) e.preventDefault(); });

// ---------- 데이터셋 열기 ----------
async function openDataset(path) {
  await Promise.all([...pending.keys()].map(f => { clearTimeout(pending.get(f)); return save(f); }));
  if (failed.size && !confirm(`저장 안 된 검수 ${failed.size}건이 있습니다. 버리고 다른 데이터셋을 열까요?`)) return;
  $('#dpath').disabled = true;
  const prev = $('#loading') && $('#loading').textContent;
  if ($('#loading')) $('#loading').textContent = '불러오는 중… (이미지가 많으면 수 초 걸립니다)';
  try {
    const res = await fetch('/api/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path})});
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || res.status);
    try { localStorage.setItem('lv_path', j.path); } catch (e) {}
    failed.clear();
    location.reload();
  } catch (e) {
    alert('열지 못했습니다: ' + e.message);
    if ($('#loading')) $('#loading').textContent = prev;
    $('#dpath').disabled = false; $('#dpath').focus();
  }
}
$('#openform').addEventListener('submit', e => { e.preventDefault(); const p = $('#dpath').value.trim(); if (p) openDataset(p); });

// ---------- 시작 ----------
(async () => {
  try {
    dataPath = (await (await fetch('/api/info')).json()).path;
    if (!dataPath) {
      let p = null; try { p = localStorage.getItem('lv_path'); } catch (e) {}
      $('#dpath').value = p || '';
      $('#loading').textContent = '위쪽 칸에 데이터셋 폴더 경로를 넣고 Enter (예: /home/roboe/superbai/data/superbai_batch02_2993ea_261028)';
      $('#dpath').focus();
      return;
    }
    $('#dpath').value = dataPath;
    const [d, r] = await Promise.all([fetch('/api/data').then(x => x.json()), fetch('/api/review').then(x => x.json())]);
    images = d.images; review = r;
    for (const v of Object.values(review)) Object.assign(v, {...blank(), ...v});
    document.title = '검수 · ' + d.name;
    const cl = [...new Set(images.map(i => i.cluster))].sort();
    $('#fcluster').innerHTML = '<option value="">클러스터: 전체</option>' +
      cl.map(c => `<option value="${c}">${c} (${images.filter(i => i.cluster === c).length})</option>`).join('');
    const cnt = {}; for (const i of images) for (const c of i.checks) cnt[c] = (cnt[c] || 0) + 1;
    $('#fcheck').innerHTML = '<option value="">자동검사: 전체</option>' +
      `<option value="any">⚠ 의심 항목 전체 (${images.filter(i => i.checks.length).length})</option>` +
      Object.keys(cnt).map(c => `<option value="${c}">${CHECKS[c] || c} (${cnt[c]})</option>`).join('') +
      '<option value="flag">✎ 내가 표시한 이미지</option>';
    $('#loading').remove();
    resize(); renderProgress();
    try {
      const b = JSON.parse(localStorage.getItem('lv_blink') || 'null');
      if (b) { $('#vblink').checked = !!b.on; if (b.sp) $('#bspeed').value = b.sp; }
    } catch (e) {}
    setBlink();
    let last = null; try { last = localStorage.getItem('lv_last:' + dataPath); } catch (e) {}
    applyFilter(last);
  } catch (e) {
    $('#loading').textContent = '데이터를 불러오지 못했습니다: ' + e;
  }
})();
</script>
